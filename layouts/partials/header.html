<nav class="page__nav main-nav">
    <ul>
        <!-- Site avatar -->
        <li class="nomarker avatar-container">
            <a href="{{ .Site.Home.RelPermalink }}" class="avatar-link">
                <img src="{{ partial "img-src.html" "avatar.jpg" }}" alt="Avatar" class="site-avatar" />
            </a>
        </li>
        <li class="nomarker">
            <h1 class="page__logo">
                <a href="{{ .Site.Home.RelPermalink }}" class="page__logo-inner">{{ .Site.Params.prompt }}</a>
            </h1>
        </li>
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
        <li class="main-nav__item">
            <a class="nav-main-item{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) (eq ($currentPage.Permalink) (.URL | absLangURL)) }} active{{ end }}"
               href="{{ .URL | relLangURL }}"
               title="{{ .Title }}">{{ .Name }}</a>
        </li>
        {{ end }}
    </ul>
</nav>
<style>
  /* Circular avatar image */
  .site-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto;
    <!-- transition: transform 0.2s ease-in-out; -->
  }

  /* Hover zoom effect */
  .site-avatar:hover {
    transform: scale(1.05);
  }
</style>
